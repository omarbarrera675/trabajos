<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos</title>
</head>
<body>
    <script>
        let nombre=String(prompt('Introduce tu nombre'));
        let edad=Number(prompt('Introduce tu edad'));
        let especialidad=String(prompt('Introduce tu especialidad'));
        let direccion=String(prompt('Introduce tu direccion'));

        document.write("Nombre: "+nombre);
        document.write("<br>")
        document.write("Edad: "+edad);
        document.write("<br>")
        document.write("Especialidad: "+especialidad);
        document.write("<br>")
        document.write("Direccion: "+direccion);
        document.write("<br>")
    </script>

    <a href="suma.html">Suma</a>
</body>
</html>
