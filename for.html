<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(i=1;i<=5;i++){
            document.write("Omar");
            document.write("<br>");
        }

        for(i=1;i<=20;i++){
            document.write("i");
            document.write("<br>");
        }

        for(i=20;i>=0;i--){
            document.write(i);
            document.write("<br>");
        }
    </script>
    
</body>
</html>
