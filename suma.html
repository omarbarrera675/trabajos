<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma</title>
</head>
<body>
    <h1>Suma</h1>
    <script>
        let N1=Number(prompt('Introduce el primer numero'));
        let N2=Number(prompt('Introduce el segundo numero'));
        suma=N1+N2;
        document.write("La suma es: "+suma);
        document.write("<br>")
        alert('La suma es: '+suma)


        resta=N1-N2;
        multi=N1*N2;
        divicion=N1/N2;
        document.write("La resta es: "+resta);
        document.write("<br>")
        document.write("La multiplicacion es: "+multi);
        document.write("<br>")
        document.write("La divicion es: "+divicion);
        document.write("<br>")
    </script><br>

<a href="datos.html">Datos</a>
    
</body>
</html>
