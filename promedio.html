<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio</title>
</head>
<body>
    <script>
        alert("Descubre tu promedio");

        let calif1=Number(prompt("Ingresa tu primer calificacion"));
        let calif2=Number(prompt("Ingresa tu segunda calificacion"));
        let calif3=Number(prompt("Ingresa tu tercer calificacion"));

        promedio=(calif1+calif2+calif3)/3;

        if(promedio>=6){
            alert("Aprobaste el semestre, promedio de: "+promedio);
        }else{
            alert("Reprobaste el semestre, promedio de: "+promedio);
        }
    </script>
</body>
</html>
